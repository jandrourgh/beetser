[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beetser"
version = "0.1.0"
description = "A modern self-hosted frontend and automation layer for beets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3",
    "watchdog>=4.0,<7",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10,<12",
    "beets==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["beetser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
