groups:
  - name: Beetser Configuration
    description: Web UI, storage and defaults.
  - name: User and Group Configuration
    description: Ownership of the data directory.

questions:
  - variable: beetser
    group: Beetser Configuration
    label: Beetser configuration
    schema:
      type: dict
      attrs:
        - variable: password
          label: Admin password
          description: Used to sign in to the web interface. Leave empty to create it on first launch.
          schema:
            type: string
            private: true
            default: ""
        - variable: port
          label: Web UI port
          schema:
            type: int
            default: 8080
            min: 1024
            max: 65535
        - variable: data_path
          label: App data path
          description: Holds the beets database, Beetser state and generated configs.
          schema:
            type: hostpath
            required: true
            default: /mnt/tank/apps/beetser
        - variable: media_path
          label: Media path
          description: Parent folder for every origin/destination you configure in the UI.
          schema:
            type: hostpath
            required: true
            default: /mnt/tank/media
        - variable: scan_interval
          label: Full scan interval (seconds)
          schema:
            type: int
            default: 300
            min: 10
            max: 86400
        - variable: settle_seconds
          label: Settle time (seconds)
          description: How long a file must be untouched before it is imported.
          schema:
            type: int
            default: 30
            min: 0
            max: 86400
        - variable: import_mode
          label: Default import mode
          schema:
            type: string
            default: move
            enum:
              - value: move
                description: Move files into the destination.
              - value: copy
                description: Copy files and keep the originals.

  - variable: beetser_run_as
    group: User and Group Configuration
    label: Run As
    schema:
      type: dict
      attrs:
        - variable: puid
          label: User ID
          schema:
            type: int
            default: 568
        - variable: pgid
          label: Group ID
          schema:
            type: int
            default: 568
