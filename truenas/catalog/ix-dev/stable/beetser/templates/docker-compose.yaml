# Chart template. The catalog library renders this with the values collected
# from questions.yaml / ix_values.yaml.
#
# NOTE: this is a scaffold. Validate it against the current truenas/apps
# library version (lib_version in app.yaml) before submitting a PR.

services:
  beetser:
    image: {{ .Values.images.image.repository }}:{{ .Values.images.image.tag }}
    container_name: beetser
    restart: unless-stopped
    environment:
      BEETSER_DATA_DIR: /config
      BEETSER_PASSWORD: {{ .Values.beetser.password | quote }}
      BEETSER_SCAN_INTERVAL: {{ .Values.beetser.scan_interval | quote }}
      PUID: {{ .Values.beetser_run_as.puid | quote }}
      PGID: {{ .Values.beetser_run_as.pgid | quote }}
      TZ: {{ .Values.TZ | default "Etc/UTC" | quote }}
    ports:
      - "{{ .Values.beetser.port }}:8080"
    volumes:
      - {{ .Values.beetser.data_path }}:/config
      # Single parent tree by default. For one mount per service (recommended
      # when services write to separate datasets), add more entries here and
      # matching fields in questions.yaml / ix_values.yaml.
      - {{ .Values.beetser.media_path }}:/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/system/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
