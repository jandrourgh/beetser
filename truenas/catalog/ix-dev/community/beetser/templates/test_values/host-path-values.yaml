resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Europe/Madrid

beetser:
  admin_password: "a-very-long-test-password"
  additional_envs:
    - name: BEETSER_LOG_LEVEL
      value: DEBUG

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

storage:
  config:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/beetser-config
  additional_storage:
    - type: host_path
      mount_path: /media/soulseek
      host_path_config:
        path: /opt/tests/mnt/soulseek
    - type: host_path
      mount_path: /media/downloads
      host_path_config:
        path: /opt/tests/mnt/downloads
