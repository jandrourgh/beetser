resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

beetser:
  admin_password: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/config
  incoming: /opt/tests/mnt/incoming

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /media/incoming
      ix_volume_config:
        dataset_name: incoming
        create_host_path: true
